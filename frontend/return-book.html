<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Return Book - Online Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

<nav class="bg-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4">
        <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
            <a href="index.html" class="flex items-center gap-2">
                <span class="text-2xl">📚</span>
                <h1 class="text-xl font-bold text-gray-800">Online Library</h1>
            </a>
            <div class="flex flex-wrap justify-center items-center gap-4 sm:gap-6">
                <a href="index.html" class="text-gray-600 hover:text-blue-600">Dashboard</a>
                <a href="books.html" class="text-gray-600 hover:text-blue-600">Books</a>
                <a href="borrow.html" class="text-gray-600 hover:text-blue-600">Borrow</a>
                <a href="return-book.html" class="text-blue-600 font-semibold">Return</a>
                <a href="borrow-history.html" class="text-gray-600 hover:text-blue-600">History</a>
                <span id="userRole" class="text-gray-700 font-medium">User</span>
                <button type="button" id="logoutBtn" class="text-red-600 hover:text-red-700 font-medium">Logout</button>
            </div>
        </div>
    </div>
</nav>

<main class="max-w-4xl mx-auto px-4 sm:px-6 py-8 sm:py-10">
    <div class="mb-8">
        <h2 class="text-2xl sm:text-3xl font-bold text-gray-800">Return Book</h2>
        <p class="mt-2 text-gray-600">Return your borrowed books and check any late fine.</p>
    </div>

    <div id="message" class="hidden mb-6 rounded-lg border px-4 py-3"></div>
    <div id="borrowedBooksList" class="space-y-4"></div>
</main>

<script type="module">
    import { getLoggedInUser, removeUser, request } from "./javascript/api.js";

    const user = getLoggedInUser();
    if (!user || !user.token) {
        window.location.href = "login.html";
        throw new Error("Not logged in");
    }

    document.getElementById("userRole").textContent = user.role === "admin" ? "Admin" : "Member";

    document.getElementById("logoutBtn").addEventListener("click", () => {
        removeUser();
        window.location.href = "login.html";
    });

    const message = document.getElementById("message");

    function showMessage(text, type = "success") {
        message.textContent = text;
        message.classList.remove(
            "hidden",
            "bg-green-100", "text-green-700", "border-green-300",
            "bg-red-100", "text-red-700", "border-red-300"
        );
        if (type === "success") {
            message.classList.add("bg-green-100", "text-green-700", "border-green-300");
        } else {
            message.classList.add("bg-red-100", "text-red-700", "border-red-300");
        }
        setTimeout(() => message.classList.add("hidden"), 4000);
    }

    function escapeHTML(value) {
        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function formatDate(dateString) {
        if (!dateString) return "-";
        return new Date(dateString).toLocaleString();
    }

    function calculateLate(dueDate) {
        const today = new Date();
        const due = new Date(dueDate);
        if (today <= due) return { lateDays: 0, fine: 0 };

        const difference = today.getTime() - due.getTime();
        const lateDays = Math.ceil(difference / (1000 * 60 * 60 * 24));
        return { lateDays, fine: lateDays * 10 }; // ৳10 per day
    }

    async function loadBorrowedBooks() {
        const list = document.getElementById("borrowedBooksList");
        list.innerHTML = `<div class="text-center text-gray-500 py-10">Loading...</div>`;

        try {
            const data = await request("/borrow/my");
            const borrows = Array.isArray(data) ? data : [];

            // Only show books that are not returned yet
            const activeBorrows = borrows.filter(b => b.returned === false);

            if (activeBorrows.length === 0) {
                list.innerHTML = `
                    <div class="bg-white rounded-xl shadow-md p-10 text-center">
                        <div class="text-5xl mb-4">📖</div>
                        <p class="text-gray-500">You have no books to return.</p>
                        <a href="books.html" class="inline-block mt-4 bg-blue-600 text-white px-5 py-3 rounded-lg font-medium hover:bg-blue-700">
                            Browse Books
                        </a>
                    </div>`;
                return;
            }

            list.innerHTML = "";

            activeBorrows.forEach(borrow => {
                const book = borrow.book || {};
                const late = calculateLate(borrow.dueDate);
                const isLate = late.lateDays > 0;

                const card = document.createElement("div");
                card.className = "bg-white rounded-xl shadow-md p-5 sm:p-6";

                card.innerHTML = `
                    <div class="flex flex-col gap-5">
                        <div>
                            <h3 class="text-xl font-bold text-gray-800">${escapeHTML(book.title || "Unknown Book")}</h3>
                            <p class="text-sm text-gray-500 mt-2">Author: ${escapeHTML(book.author || "-")}</p>
                            <p class="text-sm text-gray-500 mt-1">Borrowed: ${formatDate(borrow.borrowedAt)}</p>
                            <p class="text-sm text-gray-500 mt-1">Due: <span class="font-medium">${formatDate(borrow.dueDate)}</span></p>
                        </div>

                        <div class="rounded-lg p-4 ${isLate ? "bg-red-50" : "bg-green-50"}">
                            ${isLate
                                ? `<p class="text-red-700 font-semibold">⚠️ Late Return</p>
                                   <p class="text-red-600 mt-1">Late by: ${late.lateDays} day(s)</p>
                                   <p class="text-red-700 font-bold text-lg mt-1">Fine: ৳${late.fine}</p>`
                                : `<p class="text-green-700 font-semibold">✓ No Fine</p>
                                   <p class="text-green-600 mt-1">Return before the due date to avoid a fine.</p>`
                            }
                        </div>

                        <div>
                            <button type="button"
                                class="return-btn w-full bg-green-600 text-white px-6 py-3 rounded-lg font-medium hover:bg-green-700"
                                data-id="${borrow._id}">
                                Return Book
                            </button>
                        </div>
                    </div>
                `;
                list.appendChild(card);
            });

            // Attach return buttons
            document.querySelectorAll(".return-btn").forEach(btn => {
                btn.addEventListener("click", () => returnBook(btn.dataset.id, btn));
            });

        } catch (err) {
            console.error(err);
            list.innerHTML = `
                <div class="bg-white rounded-xl shadow-md p-8 text-center text-red-500">
                    Failed to load borrowed books.
                </div>`;
            showMessage(err.message || "Failed to load data", "error");
        }
    }

    async function returnBook(borrowId, button) {
        if (!confirm("Are you sure you want to return this book?")) return;

        button.disabled = true;
        button.textContent = "Returning...";

        try {
            const result = await request(`/borrow/${borrowId}/return`, {
                method: "PUT"
            });

            const fine = result.fine || 0;
            const lateDays = result.lateDays || 0;

            if (fine > 0) {
                showMessage(`Book returned. Late by ${lateDays} day(s). Fine: ৳${fine}`, "success");
            } else {
                showMessage("Book returned successfully! Fine: ৳0", "success");
            }

            // Reload the list
            loadBorrowedBooks();

        } catch (err) {
            console.error(err);
            showMessage(err.message || "Failed to return book", "error");
            button.disabled = false;
            button.textContent = "Return Book";
        }
    }

    // Start
    loadBorrowedBooks();
</script>
</body>
</html>
