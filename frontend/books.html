<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books - Online Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- NAVBAR -->
    <nav class="bg-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4">
            <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
                <a href="index.html" class="flex items-center gap-2">
                    <span class="text-2xl">📚</span>
                    <h1 class="text-xl font-bold text-gray-800">Online Library</h1>
                </a>

                <div class="flex flex-wrap justify-center items-center gap-4 sm:gap-6">
                    <a href="index.html" class="text-gray-600 hover:text-blue-600">Dashboard</a>
                    <a href="books.html" class="text-blue-600 font-semibold">Books</a>
                    <a href="borrow.html" class="text-gray-600 hover:text-blue-600">Borrow</a>
                    <a href="return-book.html" class="text-gray-600 hover:text-blue-600">Return</a>
                    <a href="borrow-history.html" class="text-gray-600 hover:text-blue-600">History</a>
                    <a id="addBookNav" href="add-book.html" class="text-gray-600 hover:text-blue-600">Add Book</a>

                    <span id="userRole" class="text-gray-700 font-medium">User</span>
                    <button type="button" id="logoutBtn" class="text-red-600 hover:text-red-700 font-medium">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8 sm:py-10">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-8">
            <div>
                <h2 class="text-2xl sm:text-3xl font-bold text-gray-800">Books</h2>
                <p class="mt-2 text-gray-600">Browse and manage library books.</p>
            </div>
            <a id="addBookButton" href="add-book.html"
               class="bg-blue-600 text-white px-5 py-3 rounded-lg font-medium text-center hover:bg-blue-700">
                + Add Book
            </a>
        </div>

        <div class="bg-white rounded-xl shadow-md p-5 mb-6">
            <label for="searchInput" class="block text-sm font-semibold text-gray-700 mb-2">Search Books</label>
            <input id="searchInput" type="text" placeholder="Search by title, author or category..."
                   class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>

        <div id="message" class="hidden mb-6 rounded-lg border px-4 py-3"></div>

        <!-- THIS IS THE CONTAINER FOR THE BOOKS -->
        <div id="booksList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </main>

    <script type="module">
    import { getLoggedInUser, removeUser, request } from "./javascript/api.js";

    // ===== Protect page =====
    const user = getLoggedInUser();
    if (!user || !user.token) {
        window.location.href = "login.html";
        throw new Error("Not logged in");
    }

    const role = user.role || "member";

    // Safe element access
    const userRoleEl = document.getElementById("userRole");
    if (userRoleEl) {
        userRoleEl.textContent = role === "admin" ? "Admin" : "Member";
    }

    // Hide Add Book for non-admin
    if (role !== "admin") {
        const addBookNav = document.getElementById("addBookNav");
        const addBookButton = document.getElementById("addBookButton");
        if (addBookNav) addBookNav.style.display = "none";
        if (addBookButton) addBookButton.style.display = "none";
    }

    // Logout
    const logoutBtn = document.getElementById("logoutBtn");
    if (logoutBtn) {
        logoutBtn.addEventListener("click", () => {
            removeUser();
            window.location.href = "login.html";
        });
    }

    // ===== State =====
    let books = [];

    const message = document.getElementById("message");

    // ===== Toast / Alert Message =====
    function showMessage(text, type = "success") {
        if (!message) {
            alert(text); // fallback
            return;
        }
        message.textContent = text;
        message.classList.remove(
            "hidden",
            "bg-green-100", "text-green-700", "border-green-300",
            "bg-red-100", "text-red-700", "border-red-300"
        );

        if (type === "success") {
            message.classList.add("bg-green-100", "text-green-700", "border-green-300");
        } else {
            message.classList.add("bg-red-100", "text-red-700", "border-red-300");
        }

        // Show for 3.5 seconds
        setTimeout(() => {
            message.classList.add("hidden");
        }, 3500);
    }

    function escapeHTML(value) {
        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    // ===== Display Books =====
    function displayBooks(bookList) {
        const booksList = document.getElementById("booksList");
        if (!booksList) return;

        booksList.innerHTML = "";

        if (bookList.length === 0) {
            booksList.innerHTML = `
                <div class="col-span-full bg-white rounded-xl shadow-md p-10 text-center">
                    <div class="text-5xl mb-4">📚</div>
                    <p class="text-gray-500">No books found.</p>
                </div>`;
            return;
        }

        bookList.forEach(book => {
            const id = book._id || book.id;
            const quantity = Number(book.quantity) || 0;
            const available = quantity > 0;

            const card = document.createElement("div");
            card.className = "bg-white rounded-xl shadow-md p-6 hover:shadow-lg transition";
            card.innerHTML = `
                <h3 class="text-xl font-bold text-gray-800">${escapeHTML(book.title || "")}</h3>
                <p class="text-gray-500 mt-2">
                    <span class="font-medium text-gray-700">Author:</span> ${escapeHTML(book.author || "-")}
                </p>
                <p class="text-gray-500 mt-1">
                    <span class="font-medium text-gray-700">Category:</span> ${escapeHTML(book.category || "-")}
                </p>
                <div class="mt-4">
                    ${available
                        ? `<span class="inline-block bg-green-100 text-green-700 px-3 py-1 rounded-full text-sm font-medium">Available: ${quantity}</span>`
                        : `<span class="inline-block bg-red-100 text-red-700 px-3 py-1 rounded-full text-sm font-medium">Not Available</span>`
                    }
                </div>
                <div class="mt-5 flex flex-wrap gap-3">
                    ${available
                        ? `<button type="button" class="borrow-btn flex-1 bg-blue-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-blue-700" data-id="${id}">
                            Borrow
                           </button>`
                        : ""
                    }
                    ${role === "admin" ? `
                        <a href="add-book.html?id=${id}" class="bg-yellow-500 text-white px-4 py-2 rounded-lg font-medium hover:bg-yellow-600">
                            Edit
                        </a>
                        <button type="button" class="delete-btn bg-red-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-red-700" data-id="${id}">
                            Delete
                        </button>
                    ` : ""}
                </div>
            `;
            booksList.appendChild(card);
        });
    }

    // ===== Load books from backend =====
    async function loadBooks() {
        try {
            const data = await request("/books");
            books = Array.isArray(data) ? data : (data.books || []);
            displayBooks(books);
        } catch (err) {
            console.error(err);
            showMessage(err.message || "Failed to load books", "error");
            displayBooks([]);
        }
    }

    // ===== Search =====
    const searchInput = document.getElementById("searchInput");
    if (searchInput) {
        searchInput.addEventListener("input", function () {
            const search = this.value.toLowerCase().trim();
            const filtered = books.filter(book =>
                String(book.title || "").toLowerCase().includes(search) ||
                String(book.author || "").toLowerCase().includes(search) ||
                String(book.category || "").toLowerCase().includes(search) ||
                String(book.isbn || "").toLowerCase().includes(search)
            );
            displayBooks(filtered);
        });
    }

    // ===== Borrow + Delete =====
    const booksListEl = document.getElementById("booksList");
    if (booksListEl) {
        booksListEl.addEventListener("click", async (e) => {

            // ========== BORROW ==========
            if (e.target.classList.contains("borrow-btn")) {
                const id = e.target.dataset.id;
                const book = books.find(b => (b._id || b.id) === id);

                if (!book) return;

                if (!confirm(`Do you want to borrow "${book.title}"?`)) return;

                try {
                    // Call backend to borrow
                    await request("/borrow", {
                        method: "POST",
                        body: JSON.stringify({ bookId: id })
                    });

                    // Decrease quantity on frontend immediately
                    book.quantity = Math.max(0, (Number(book.quantity) || 0) - 1);
                    displayBooks(books);

                    showMessage(`Successfully borrowed "${book.title}"`, "success");
                } catch (err) {
                    console.error(err);
                    showMessage(err.message || "Failed to borrow book", "error");
                }
            }

            // ========== DELETE (Admin only) ==========
            if (e.target.classList.contains("delete-btn")) {
                const id = e.target.dataset.id;
                const book = books.find(b => (b._id || b.id) === id);

                if (!confirm(`Are you sure you want to delete "${book?.title || "this book"}"?`)) return;

                try {
                    await request(`/books/${id}`, { method: "DELETE" });

                    // Remove from local list
                    books = books.filter(b => (b._id || b.id) !== id);
                    displayBooks(books);

                    showMessage("Book deleted successfully", "success");
                } catch (err) {
                    console.error(err);
                    showMessage(err.message || "Failed to delete book", "error");
                }
            }
        });
    }

    // ===== Start =====
    loadBooks();
</script>
</body>
</html>
