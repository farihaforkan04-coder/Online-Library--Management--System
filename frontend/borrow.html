<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Borrowed Books - Online Library</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

<nav class="bg-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4">
        <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
            <a href="index.html" class="flex items-center gap-2">
                <span class="text-2xl">📚</span>
                <h1 class="text-xl font-bold text-gray-800">Online Library</h1>
            </a>
            <div class="flex flex-wrap justify-center items-center gap-4 sm:gap-6">
                <a href="index.html" class="text-gray-600 hover:text-blue-600">Dashboard</a>
                <a href="books.html" class="text-gray-600 hover:text-blue-600">Books</a>
                <a href="borrow.html" class="text-blue-600 font-semibold">Borrow</a>
                <a href="return-book.html" class="text-gray-600 hover:text-blue-600">Return</a>
                <a href="borrow-history.html" class="text-gray-600 hover:text-blue-600">History</a>
                <span id="userRole" class="text-gray-700 font-medium">User</span>
                <button type="button" id="logoutBtn" class="text-red-600 hover:text-red-700 font-medium">Logout</button>
            </div>
        </div>
    </div>
</nav>

<main class="max-w-5xl mx-auto px-4 sm:px-6 py-8 sm:py-10">
    <div class="mb-8">
        <h2 class="text-2xl sm:text-3xl font-bold text-gray-800">My Borrowed Books</h2>
        <p class="mt-2 text-gray-600">Books you have currently borrowed.</p>
    </div>

    <div id="message" class="hidden mb-6 rounded-lg border px-4 py-3"></div>
    <div id="borrowedList" class="space-y-4"></div>
</main>

<script type="module">
    import { getLoggedInUser, removeUser, request } from "./javascript/api.js";

    // Protect page
    const user = getLoggedInUser();
    if (!user || !user.token) {
        window.location.href = "login.html";
        throw new Error("Not logged in");
    }

    document.getElementById("userRole").textContent = user.role === "admin" ? "Admin" : "Member";

    document.getElementById("logoutBtn").addEventListener("click", () => {
        removeUser();
        window.location.href = "login.html";
    });

    const message = document.getElementById("message");

    function showMessage(text, type = "success") {
        message.textContent = text;
        message.classList.remove(
            "hidden",
            "bg-green-100", "text-green-700", "border-green-300",
            "bg-red-100", "text-red-700", "border-red-300"
        );
        if (type === "success") {
            message.classList.add("bg-green-100", "text-green-700", "border-green-300");
        } else {
            message.classList.add("bg-red-100", "text-red-700", "border-red-300");
        }
        setTimeout(() => message.classList.add("hidden"), 3500);
    }

    function escapeHTML(value) {
        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function formatDate(dateString) {
        if (!dateString) return "-";
        return new Date(dateString).toLocaleString();
    }

    async function loadMyBorrows() {
        const list = document.getElementById("borrowedList");
        list.innerHTML = `<div class="text-center text-gray-500 py-10">Loading...</div>`;

        try {
            const data = await request("/borrow/my");
            const borrows = Array.isArray(data) ? data : [];

            // Only show books that are not yet returned
            const activeBorrows = borrows.filter(b => b.returned === false);

            if (activeBorrows.length === 0) {
                list.innerHTML = `
                    <div class="bg-white rounded-xl shadow-md p-10 text-center">
                        <div class="text-5xl mb-4">📖</div>
                        <p class="text-gray-500">You have no borrowed books.</p>
                    </div>`;
                return;
            }

            list.innerHTML = "";

            activeBorrows.forEach(borrow => {
                const book = borrow.book || {};
                const card = document.createElement("div");
                card.className = "bg-white rounded-xl shadow-md p-5 sm:p-6";

                card.innerHTML = `
                    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-5">
                        <div>
                            <h3 class="text-xl font-bold text-gray-800">${escapeHTML(book.title || "Unknown Book")}</h3>
                            <p class="text-gray-500 mt-1">Author: ${escapeHTML(book.author || "-")}</p>
                            <p class="text-gray-500 mt-1">Category: ${escapeHTML(book.category || "-")}</p>
                            <p class="text-gray-500 mt-1">Borrowed At: ${formatDate(borrow.borrowedAt)}</p>
                            <p class="text-gray-500 mt-1">Due Date: <span class="font-medium text-red-600">${formatDate(borrow.dueDate)}</span></p>
                        </div>
                        <div>
                            <span class="inline-block bg-yellow-100 text-yellow-700 px-4 py-2 rounded-lg font-medium">
                                Currently Borrowed
                            </span>
                        </div>
                    </div>
                `;
                list.appendChild(card);
            });

        } catch (err) {
            console.error(err);
            list.innerHTML = `
                <div class="bg-white rounded-xl shadow-md p-8 text-center text-red-500">
                    Failed to load borrowed books.
                </div>`;
            showMessage(err.message || "Failed to load data", "error");
        }
    }

    // Start
    loadMyBorrows();
</script>
</body>
</html>
