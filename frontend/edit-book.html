<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Book - Online Library</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

<nav class="bg-white shadow-md">

    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4">

        <div class="flex flex-col sm:flex-row items-center justify-between gap-4">

            <a href="index.html" class="flex items-center gap-2">
                <span class="text-2xl">📚</span>

                <h1 class="text-xl font-bold text-gray-800">
                    Online Library
                </h1>
            </a>

            <div class="flex flex-wrap justify-center items-center gap-4 sm:gap-6">

                <a href="index.html"
                   class="text-gray-600 hover:text-blue-600">
                    Dashboard
                </a>

                <a href="books.html"
                   class="text-blue-600 font-semibold">
                    Books
                </a>

                <a href="add-book.html"
                   class="text-gray-600 hover:text-blue-600">
                    Add Book
                </a>

                <span id="userRole"
                      class="text-gray-700 font-medium">
                    Admin
                </span>

                <button onclick="logout()"
                        class="text-red-600 hover:text-red-700 font-medium">
                    Logout
                </button>

            </div>

        </div>

    </div>

</nav>

<main class="max-w-2xl mx-auto px-4 sm:px-6 py-8 sm:py-10">

    <div class="bg-white rounded-xl shadow-md p-6 sm:p-8">

        <h1 class="text-2xl sm:text-3xl font-bold text-gray-800">
            Edit Book
        </h1>

        <p class="mt-2 text-gray-600">
            Update the information of this book.
        </p>

        <div id="errorMessage"
             class="hidden mt-5 bg-red-100 border border-red-300
                    text-red-700 rounded-lg px-4 py-3">
        </div>

        <div id="successMessage"
             class="hidden mt-5 bg-green-100 border border-green-300
                    text-green-700 rounded-lg px-4 py-3">
        </div>

        <form id="editBookForm" class="mt-6">

            <div class="mb-5">
                <label for="isbn"
                       class="block font-semibold mb-2">
                    ISBN
                </label>

                <input type="text"
                       id="isbn"
                       required
                       maxlength="20"
                       class="w-full border border-gray-300 rounded-lg px-4 py-3
                              focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div class="mb-5">
                <label for="title"
                       class="block font-semibold mb-2">
                    Book Title
                </label>

                <input type="text"
                       id="title"
                       required
                       maxlength="150"
                       class="w-full border border-gray-300 rounded-lg px-4 py-3
                              focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div class="mb-5">
                <label for="author"
                       class="block font-semibold mb-2">
                    Author
                </label>

                <input type="text"
                       id="author"
                       required
                       maxlength="100"
                       class="w-full border border-gray-300 rounded-lg px-4 py-3
                              focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div class="mb-5">
                <label for="category"
                       class="block font-semibold mb-2">
                    Category
                </label>

                <select id="category"
                        required
                        class="w-full border border-gray-300 rounded-lg px-4 py-3
                               bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">

                    <option value="">Select Category</option>
                    <option value="Programming">Programming</option>
                    <option value="Self Help">Self Help</option>
                    <option value="Fiction">Fiction</option>
                    <option value="Science">Science</option>
                    <option value="History">History</option>

                </select>
            </div>

            <div class="mb-5">
                <label for="publisher"
                       class="block font-semibold mb-2">
                    Publisher
                </label>

                <input type="text"
                       id="publisher"
                       class="w-full border border-gray-300 rounded-lg px-4 py-3
                              focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div class="mb-5">
                <label for="publicationYear"
                       class="block font-semibold mb-2">
                    Publication Year
                </label>

                <input type="number"
                       id="publicationYear"
                       min="1000"
                       max="2100"
                       class="w-full border border-gray-300 rounded-lg px-4 py-3
                              focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div class="mb-6">
                <label for="quantity"
                       class="block font-semibold mb-2">
                    Quantity
                </label>

                <input type="number"
                       id="quantity"
                       min="0"
                       max="10000"
                       required
                       class="w-full border border-gray-300 rounded-lg px-4 py-3
                              focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div class="flex flex-col sm:flex-row gap-3">

                <button type="submit"
                        class="bg-blue-600 text-white px-6 py-3 rounded-lg
                               hover:bg-blue-700 font-medium">
                    Update Book
                </button>

                <a href="books.html"
                   class="text-center px-6 py-3 border border-gray-300
                          rounded-lg text-gray-700 hover:bg-gray-100">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</main>

<script src="js/auth.js"></script>

<script>

protectAdminPage();

showUserInfo("userRole");

const urlParams =
    new URLSearchParams(window.location.search);

const bookId =
    Number(urlParams.get("id"));

let books =
    JSON.parse(localStorage.getItem("books")) || [];

const bookIndex =
    books.findIndex(function(book) {
        return Number(book.id) === bookId;
    });

const form =
    document.getElementById("editBookForm");

const errorMessage =
    document.getElementById("errorMessage");

const successMessage =
    document.getElementById("successMessage");

if (bookIndex === -1) {

    errorMessage.textContent =
        "Book could not be found.";

    errorMessage.classList.remove("hidden");

    form.style.display = "none";

} else {

    const book = books[bookIndex];

    document.getElementById("isbn").value =
        book.isbn || "";

    document.getElementById("title").value =
        book.title || "";

    document.getElementById("author").value =
        book.author || "";

    document.getElementById("category").value =
        book.category || "";

    document.getElementById("publisher").value =
        book.publisher || "";

    document.getElementById("publicationYear").value =
        book.publicationYear || "";

    document.getElementById("quantity").value =
        book.quantity ?? 0;


    form.addEventListener("submit", function(event) {

        event.preventDefault();

        errorMessage.classList.add("hidden");
        successMessage.classList.add("hidden");

        const isbn =
            document.getElementById("isbn").value.trim();

        const title =
            document.getElementById("title").value.trim();

        const author =
            document.getElementById("author").value.trim();

        const category =
            document.getElementById("category").value;

        const publisher =
            document.getElementById("publisher").value.trim();

        const publicationYear =
            document.getElementById("publicationYear").value.trim();

        const quantity =
            Number(document.getElementById("quantity").value);


        if (!isbn || !title || !author || !category) {

            errorMessage.textContent =
                "Please fill in all required fields.";

            errorMessage.classList.remove("hidden");

            return;
        }


        if (!/^[0-9-]+$/.test(isbn)) {

            errorMessage.textContent =
                "ISBN can contain only numbers and hyphens.";

            errorMessage.classList.remove("hidden");

            return;
        }


        if (
            publicationYear !== "" &&
            (
                Number(publicationYear) < 1000 ||
                Number(publicationYear) > 2100
            )
        ) {

            errorMessage.textContent =
                "Please enter a valid publication year.";

            errorMessage.classList.remove("hidden");

            return;
        }


        if (!Number.isInteger(quantity) || quantity < 0) {

            errorMessage.textContent =
                "Quantity cannot be negative.";

            errorMessage.classList.remove("hidden");

            return;
        }


        const duplicate =
            books.some(function(existingBook) {

                if (Number(existingBook.id) === bookId) {
                    return false;
                }

                return String(existingBook.isbn)
                    .trim()
                    .toLowerCase() === isbn.toLowerCase();
            });


        if (duplicate) {

            errorMessage.textContent =
                "Another book already uses this ISBN.";

            errorMessage.classList.remove("hidden");

            return;
        }


        books[bookIndex] = {

            ...books[bookIndex],

            isbn: isbn,
            title: title,
            author: author,
            category: category,
            publisher: publisher,
            publicationYear: publicationYear,
            quantity: quantity

        };


        localStorage.setItem(
            "books",
            JSON.stringify(books)
        );


        successMessage.textContent =
            "Book updated successfully.";

        successMessage.classList.remove("hidden");


        setTimeout(function() {

            window.location.href = "books.html";

        }, 800);

    });
}

</script>

</body>
</html>
