<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | Online Library</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center px-4">
  <main class="w-full max-w-md bg-white rounded-xl shadow-lg p-8">
    <h1 class="text-2xl font-bold text-gray-800">Create an account</h1>
    <p class="text-gray-500 mt-2">Register as a library member.</p>

    <form id="registerForm" class="mt-6 space-y-4">
      <div>
        <label for="name" class="block text-sm font-medium text-gray-700">Full name</label>
        <input id="name" type="text" required
          class="mt-1 w-full rounded-md border border-gray-300 px-3 py-2" />
      </div>

      <div>
        <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
        <input id="email" type="email" required
          class="mt-1 w-full rounded-md border border-gray-300 px-3 py-2" />
      </div>

      <div>
        <label for="phone" class="block text-sm font-medium text-gray-700">Phone number</label>
        <input id="phone" type="text"
          class="mt-1 w-full rounded-md border border-gray-300 px-3 py-2" />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
        <input id="password" type="password" minlength="6" required
          class="mt-1 w-full rounded-md border border-gray-300 px-3 py-2" />
      </div>

      <div>
        <label for="confirmPassword" class="block text-sm font-medium text-gray-700">Confirm password</label>
        <input id="confirmPassword" type="password" minlength="6" required
          class="mt-1 w-full rounded-md border border-gray-300 px-3 py-2" />
      </div>

      <p id="errorMessage" class="hidden rounded-md bg-red-100 p-3 text-sm text-red-700"></p>

      <button type="submit"
        class="w-full rounded-md bg-blue-600 px-4 py-2 font-semibold text-white hover:bg-blue-700">
        Create account
      </button>
    </form>

    <p class="mt-5 text-center text-sm text-gray-600">
      Already have an account?
      <a href="./login.html" class="font-semibold text-blue-600">Sign in</a>
    </p>
  </main>

<script type="module" src="javascript/register.js"></script>
</html>
