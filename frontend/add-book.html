<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Add Book - Online Library</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>


<body class="bg-gray-100 min-h-screen">


    <!-- NAVBAR -->

    <nav class="bg-white shadow-md">

        <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4">

            <div class="flex flex-col sm:flex-row
                        items-center justify-between gap-4">

                <a
                    href="index.html"
                    class="flex items-center gap-2">

                    <span class="text-2xl">📚</span>

                    <h1 class="text-xl font-bold text-gray-800">
                        Online Library
                    </h1>

                </a>


                <div class="flex flex-wrap
                            justify-center
                            items-center
                            gap-4 sm:gap-6">

                    <a
                        href="index.html"
                        class="text-gray-600 hover:text-blue-600">
                        Dashboard
                    </a>


                    <a
                        href="books.html"
                        class="text-gray-600 hover:text-blue-600">
                        Books
                    </a>


                    <a
                        href="borrow.html"
                        class="text-gray-600 hover:text-blue-600">
                        Borrow
                    </a>


                    <a
                        href="return-book.html"
                        class="text-gray-600 hover:text-blue-600">
                        Return
                    </a>


                    <a
                        href="borrow-history.html"
                        class="text-gray-600 hover:text-blue-600">
                        History
                    </a>


                    <span
                        id="userRole"
                        class="text-gray-700 font-medium">
                        Admin
                    </span>


                    <button
                        type="button"
                        onclick="logout()"
                        class="text-red-600 hover:text-red-700 font-medium">
                        Logout
                    </button>

                </div>

            </div>

        </div>

    </nav>



    <!-- MAIN -->

    <main
        class="max-w-2xl mx-auto
               px-4 sm:px-6
               py-8 sm:py-10">


        <div class="mb-8">

            <h2
                id="pageTitle"
                class="text-2xl sm:text-3xl
                       font-bold text-gray-800">

                Add New Book

            </h2>


            <p
                id="pageSubtitle"
                class="mt-2 text-gray-600">

                Add a new book to the library.

            </p>

        </div>



        <!-- MESSAGE -->

        <div
            id="message"
            class="hidden mb-6
                   rounded-lg border
                   px-4 py-3">
        </div>



        <!-- FORM -->

        <div
            class="bg-white rounded-xl
                   shadow-md p-6 sm:p-8">


            <form id="bookForm">


                <!-- TITLE -->

                <div class="mb-5">

                    <label
                        for="title"
                        class="block text-sm
                               font-semibold
                               text-gray-700 mb-2">

                        Book Title

                    </label>


                    <input
                        id="title"
                        type="text"
                        placeholder="Enter book title"
                        required
                        class="w-full border
                               border-gray-300
                               rounded-lg
                               px-4 py-3
                               focus:outline-none
                               focus:ring-2
                               focus:ring-blue-500">

                </div>



                <!-- AUTHOR -->

                <div class="mb-5">

                    <label
                        for="author"
                        class="block text-sm
                               font-semibold
                               text-gray-700 mb-2">

                        Author

                    </label>


                    <input
                        id="author"
                        type="text"
                        placeholder="Enter author name"
                        required
                        class="w-full border
                               border-gray-300
                               rounded-lg
                               px-4 py-3
                               focus:outline-none
                               focus:ring-2
                               focus:ring-blue-500">

                </div>



                <!-- CATEGORY -->

                <div class="mb-5">

                    <label
                        for="category"
                        class="block text-sm
                               font-semibold
                               text-gray-700 mb-2">

                        Category

                    </label>


                    <input
                        id="category"
                        type="text"
                        placeholder="e.g. Fiction, Science"
                        required
                        class="w-full border
                               border-gray-300
                               rounded-lg
                               px-4 py-3
                               focus:outline-none
                               focus:ring-2
                               focus:ring-blue-500">

                </div>



                <!-- QUANTITY -->

                <div class="mb-6">

                    <label
                        for="quantity"
                        class="block text-sm
                               font-semibold
                               text-gray-700 mb-2">

                        Quantity

                    </label>


                    <input
                        id="quantity"
                        type="number"
                        min="0"
                        value="1"
                        required
                        class="w-full border
                               border-gray-300
                               rounded-lg
                               px-4 py-3
                               focus:outline-none
                               focus:ring-2
                               focus:ring-blue-500">

                </div>



                <!-- BUTTONS -->

                <div
                    class="flex flex-col
                           sm:flex-row
                           gap-3">


                    <button
                        id="submitButton"
                        type="submit"
                        class="flex-1
                               bg-blue-600
                               text-white
                               py-3
                               rounded-lg
                               font-semibold
                               hover:bg-blue-700">

                        Add Book

                    </button>


                    <a
                        href="books.html"
                        class="flex-1
                               bg-gray-200
                               text-gray-700
                               py-3
                               rounded-lg
                               font-semibold
                               text-center
                               hover:bg-gray-300">

                        Cancel

                    </a>

                </div>


            </form>

        </div>

    </main>



    <!-- AUTH -->

    <script src="js/auth.js"></script>


    <script>

        // ================================
        // ADMIN PROTECTION
        // ================================

        if (!protectAdminPage()) {

            throw new Error("Admin access required");

        }


        showUserInfo("userRole");


        // ================================
        // ELEMENTS
        // ================================

        const form =
            document.getElementById("bookForm");

        const titleInput =
            document.getElementById("title");

        const authorInput =
            document.getElementById("author");

        const categoryInput =
            document.getElementById("category");

        const quantityInput =
            document.getElementById("quantity");

        const message =
            document.getElementById("message");

        const pageTitle =
            document.getElementById("pageTitle");

        const pageSubtitle =
            document.getElementById("pageSubtitle");

        const submitButton =
            document.getElementById("submitButton");


        // ================================
        // GET EDIT ID
        // ================================

        const params =
            new URLSearchParams(
                window.location.search
            );


        const editId =
            params.get("id");


        let books =
            JSON.parse(
                localStorage.getItem("books")
            ) || [];


        // ================================
        // MESSAGE
        // ================================

        function showMessage(text, type) {

            message.textContent = text;

            message.classList.remove(
                "hidden",
                "bg-green-100",
                "text-green-700",
                "border-green-300",
                "bg-red-100",
                "text-red-700",
                "border-red-300"
            );


            if (type === "success") {

                message.classList.add(
                    "bg-green-100",
                    "text-green-700",
                    "border-green-300"
                );

            } else {

                message.classList.add(
                    "bg-red-100",
                    "text-red-700",
                    "border-red-300"
                );

            }

        }


        // ================================
        // EDIT MODE
        // ================================

        if (editId !== null) {

            const book =
                books.find(
                    function(item) {

                        return Number(item.id) ===
                               Number(editId);

                    }
                );


            if (!book) {

                showMessage(
                    "Book not found.",
                    "error"
                );

                submitButton.disabled = true;

            } else {

                pageTitle.textContent =
                    "Edit Book";


                pageSubtitle.textContent =
                    "Update the book information.";


                submitButton.textContent =
                    "Update Book";


                titleInput.value =
                    book.title || "";


                authorInput.value =
                    book.author || "";


                categoryInput.value =
                    book.category || "";


                quantityInput.value =
                    Number(book.quantity) || 0;

            }

        }


        // ================================
        // FORM SUBMIT
        // ================================

        form.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const title =
                    titleInput.value.trim();


                const author =
                    authorInput.value.trim();


                const category =
                    categoryInput.value.trim();


                const quantity =
                    Number(
                        quantityInput.value
                    );


                // Validation

                if (
                    title === "" ||
                    author === "" ||
                    category === ""
                ) {

                    showMessage(
                        "Please fill in all fields.",
                        "error"
                    );

                    return;

                }


                if (
                    !Number.isFinite(quantity) ||
                    quantity < 0
                ) {

                    showMessage(
                        "Please enter a valid quantity.",
                        "error"
                    );

                    return;

                }


                // ============================
                // EDIT
                // ============================

                if (editId !== null) {

                    const index =
                        books.findIndex(
                            function(item) {

                                return Number(item.id) ===
                                       Number(editId);

                            }
                        );


                    if (index === -1) {

                        showMessage(
                            "Book not found.",
                            "error"
                        );

                        return;

                    }


                    books[index].title =
                        title;


                    books[index].author =
                        author;


                    books[index].category =
                        category;


                    books[index].quantity =
                        quantity;


                    localStorage.setItem(
                        "books",
                        JSON.stringify(
                            books
                        )
                    );


                    showMessage(
                        "Book updated successfully!",
                        "success"
                    );


                    setTimeout(
                        function() {

                            window.location.href =
                                "books.html";

                        },
                        700
                    );


                    return;

                }


                // ============================
                // ADD NEW BOOK
                // ============================

                const newBook = {

                    id: Date.now(),

                    title: title,

                    author: author,

                    category: category,

                    quantity: quantity

                };


                books.push(
                    newBook
                );


                localStorage.setItem(
                    "books",
                    JSON.stringify(
                        books
                    )
                );


                showMessage(
                    "Book added successfully!",
                    "success"
                );


                form.reset();


                quantityInput.value = 1;


                setTimeout(
                    function() {

                        window.location.href =
                            "books.html";

                    },
                    700
                );

            }
        );

    </script>
<script src="js/auth.js"></script>

</body>

</html>
